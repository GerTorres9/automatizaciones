name: Keep-Alive n8n 24/7

on:
  schedule:
    # Se ejecuta cada 10 minutos para despertar a Render si estuvo en mantenimiento
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping-n8n:
    runs-on: ubuntu-latest
    steps:
      - name: Hacer ping al endpoint /healthz de n8n en Render
        env:
          N8N_URL: ${{ vars.N8N_RENDER_URL || secrets.N8N_RENDER_URL }}
        run: |
          if [ -z "$N8N_URL" ]; then
            echo "Aviso: Aún no has configurado la variable N8N_RENDER_URL en Settings -> Secrets and variables -> Actions -> Variables."
            exit 0
          fi
          CLEAN_URL=$(echo "$N8N_URL" | sed 's:/*$::')
          echo "Enviando ping a ${CLEAN_URL}/healthz ..."
          curl -fsSL --retry 3 --retry-delay 5 --max-time 60 "${CLEAN_URL}/healthz"
          echo ""
          echo "Ping completado con éxito a las $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
