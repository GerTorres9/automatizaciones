services:
  - type: web
    name: n8n-automation
    runtime: docker
    plan: free
    autoDeploy: true
    healthCheckPath: /healthz
    envVars:
      - key: N8N_PROTOCOL
        value: https
      - key: NODE_ENV
        value: production
      - key: N8N_PROXY_HOPS
        value: "1"
      - key: GENERIC_TIMEZONE
        value: America/Mexico_City
      - key: TZ
        value: America/Mexico_City
      - key: N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS
        value: "true"
      - key: N8N_DIAGNOSTICS_ENABLED
        value: "false"
      - key: KEEP_ALIVE_INTERVAL_SECONDS
        value: "240"
      - key: N8N_ENCRYPTION_KEY
        generateValue: true
      # Para persistencia permanente al actualizar o reiniciar, pega tu URL de PostgreSQL
      # (ej. de Neon.tech o Supabase) en Render -> Environment -> DATABASE_URL
      - key: DATABASE_URL
        sync: false
